<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chipywarp Lab</title>
    <link rel="icon" type="image/x-icon" href="https://obeyorbehacked750-jpg.github.io/chipywarp-lab/assets/cw-lab.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menu Bar -->
    <nav class="navbar">
        <div class="logo">
            <img src="assets/cw-lab.png" alt="Chipywarp Lab">
        </div>
        <div class="nav-links">
            <button class="nav-btn" onclick="switchTab('home')">Home</button>
                <img src="assets/home.png" class="btn-icon">
            </button>
            <button class="nav-btn" onclick="switchTab('extensions')">Extensions</button>
                <img src="assets/extensions.png" class="btn-icon">
            </button>
            <button class="nav-btn theme-toggle" onclick="toggleTheme()">Change Theme
                <img src="assets/moon.png" class="theme-icon" id="theme-icon">
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <!-- Home Section -->
        <section id="home" class="tab-content active">
            <div class="welcome-banner">
                <h1>Welcome Chipywarp-Lab!</h1>
                <p>Test Chipywarp libraries and go check it!</p>
            </div>
        </section>

        <!-- Extensions Section -->
        <section id="extensions" class="tab-content">
            <h2>Available Extensions</h2>
            <div id="card-container" class="card-grid">
                <!-- Extension Cards will be injected here by JavaScript -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
